services:
  app:
    image: uc-workhive:current
    container_name: uc-workhive
    restart: unless-stopped
    init: true
    env_file:
      - /opt/workhive/app.env
    ports:
      - "127.0.0.1:8080:8080"
  migrate:
    image: uc-workhive:builder-${WORKHIVE_RELEASE:?Set WORKHIVE_RELEASE}
    profiles: [migration]
    env_file:
      - /opt/workhive/app.env
    working_dir: /app
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
